name: Windows portable
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'windows/**'
      - '.github/workflows/windows-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: node ../tests/calculations.cjs
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Lathe-Material-Transfer-v1.5-Windows-x64
          path: windows/dist/Lathe-Material-Transfer-v1.5-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
